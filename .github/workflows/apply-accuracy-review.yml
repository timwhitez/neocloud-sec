name: Apply accuracy review

on:
  push:
    branches:
      - audit/accuracy-and-metadata-v1

permissions:
  contents: write

concurrency:
  group: apply-accuracy-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out review branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Normalize temporary reference migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/_apply_accuracy_technical.py")
          text = path.read_text(encoding="utf-8")
          old = r"\n56. NVIDIA AI Enterprise"
          new = r"\n- NVIDIA AI Enterprise"
          if old not in text:
              raise SystemExit("vGPU reference marker not found")
          text = text.replace(old, new, 1)

          lines = text.splitlines()
          filtered = []
          for line in lines:
              if "Keep numbering unique after adding the vGPU reference" in line:
                  continue
              if line.strip().startswith("for old, new in [(61, 62)"):
                  continue
              if 'replace("REFERENCES.md", f"\\n{old}. ", f"\\n{new}. ")' in line:
                  continue
              filtered.append(line)
          text = "\n".join(filtered) + "\n"

          # The original supply-chain section ends at item 61. Append the new
          # identity/sanitization references as 62-66 without renumbering the
          # existing list; the vGPU source remains an unnumbered related item.
          text = text.replace(
              "62. NIST, *SP 800-204D: Strategies for the Integration of Software Supply Chain Security in DevSecOps CI/CD Pipelines*.",
              "61. NIST, *SP 800-204D: Strategies for the Integration of Software Supply Chain Security in DevSecOps CI/CD Pipelines*.",
          )
          shifts = [
              ("67. NIST, *SP 800-160 Vol. 1 Rev. 1", "66. NIST, *SP 800-160 Vol. 1 Rev. 1"),
              ("66. NIST, *SP 800-193", "65. NIST, *SP 800-193"),
              ("65. NIST, *SP 800-88 Rev. 2", "64. NIST, *SP 800-88 Rev. 2"),
              ("64. NIST, *SP 800-63B-4", "63. NIST, *SP 800-63B-4"),
              ("63. NIST, *SP 800-63-4", "62. NIST, *SP 800-63-4"),
          ]
          for source, target in shifts:
              if source not in text:
                  raise SystemExit(f"reference marker not found: {source}")
              text = text.replace(source, target, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply reviewed corrections
        run: |
          python3 scripts/_apply_accuracy_core.py
          python3 scripts/_apply_accuracy_technical.py

      - name: Remove one-shot migration files
        run: |
          rm scripts/_apply_accuracy_core.py
          rm scripts/_apply_accuracy_technical.py
          rm .github/workflows/apply-accuracy-review.yml

      - name: Validate repository contract
        run: python3 scripts/validate_repository.py

      - name: Commit reviewed result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: correct accuracy and project positioning"
          git push origin "HEAD:${GITHUB_REF_NAME}"
