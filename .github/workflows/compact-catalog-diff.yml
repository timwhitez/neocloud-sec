name: Preserve control catalog formatting

on:
  push:
    branches:
      - audit/accuracy-and-metadata-v1

permissions:
  contents: write

jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out review branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Preserve original formatting while retaining semantic changes
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess
          from pathlib import Path
          from typing import Any

          path = Path("controls/neocloud-security-baseline.v1.json")
          current_text = path.read_text(encoding="utf-8")
          current = json.loads(current_text)
          original_text = subprocess.check_output(
              ["git", "show", "origin/main:controls/neocloud-security-baseline.v1.json"],
              text=True,
              encoding="utf-8",
          )
          original = json.loads(original_text)
          candidate = original_text
          replacements = 0

          def walk(old: Any, new: Any, location: str = "$") -> None:
              global candidate, replacements
              if type(old) is not type(new):
                  raise SystemExit(f"type changed at {location}")
              if isinstance(old, dict):
                  if list(old) != list(new):
                      raise SystemExit(f"keys or key order changed at {location}")
                  for key in old:
                      walk(old[key], new[key], f"{location}.{key}")
                  return
              if isinstance(old, list):
                  if len(old) != len(new):
                      raise SystemExit(f"list length changed at {location}")
                  for index, (left, right) in enumerate(zip(old, new, strict=True)):
                      walk(left, right, f"{location}[{index}]")
                  return
              if old == new:
                  return
              if not isinstance(old, str) or not isinstance(new, str):
                  raise SystemExit(f"unsupported non-string semantic change at {location}")
              old_json = json.dumps(old, ensure_ascii=False)
              new_json = json.dumps(new, ensure_ascii=False)
              count = candidate.count(old_json)
              if count != 1:
                  raise SystemExit(
                      f"expected one source value at {location}; found {count}: {old!r}"
                  )
              candidate = candidate.replace(old_json, new_json, 1)
              replacements += 1

          walk(original, current)
          if json.loads(candidate) != current:
              raise SystemExit("format-preserving catalog does not match reviewed semantics")
          if replacements < 10:
              raise SystemExit(f"unexpectedly few semantic replacements: {replacements}")
          path.write_text(candidate, encoding="utf-8")
          print(f"preserved catalog formatting with {replacements} semantic changes")
          PY

      - name: Remove one-shot workflow and validate
        run: |
          rm .github/workflows/compact-catalog-diff.yml
          python3 scripts/validate_repository.py

      - name: Commit compact review diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: preserve control catalog reviewability"
          git push origin "HEAD:${GITHUB_REF_NAME}"
