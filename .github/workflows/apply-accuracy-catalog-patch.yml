name: Apply one-shot catalog accuracy patch

on:
  push:
    branches:
      - docs/accuracy-audit-and-repo-metadata

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out audit branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: docs/accuracy-audit-and-repo-metadata
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Apply asserted replacements
        run: python3 scripts/apply_accuracy_catalog_patch.py

      - name: Preserve human-readable and machine state names
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('controls/neocloud-security-baseline.v1.json')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'produces NO_GO_NONCONFORMANT; a business-risk decision':
                  'produces NO-GO (NO_GO_NONCONFORMANT); a business-risk decision',
              '均产生 NO_GO_NONCONFORMANT，业务风险决定':
                  '均产生 NO-GO（NO_GO_NONCONFORMANT），业务风险决定',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence, found {text.count(old)}: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patched repository
        run: python3 scripts/validate_repository.py

      - name: Remove one-shot patch machinery
        run: |
          git rm .github/workflows/apply-accuracy-catalog-patch.yml
          git rm scripts/apply_accuracy_catalog_patch.py

      - name: Revalidate final tree
        run: python3 scripts/validate_repository.py

      - name: Commit deterministic corrections
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo 'No patch was produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add controls/neocloud-security-baseline.v1.json \
                  docs/en/SECURITY_BASELINE.md \
                  docs/zh-CN/SECURITY_BASELINE.md \
                  docs/en/METRICS_AND_ASSURANCE.md \
                  docs/zh-CN/METRICS_AND_ASSURANCE.md
          git commit -m 'controls: apply audited semantic corrections'
          git push origin HEAD:docs/accuracy-audit-and-repo-metadata
